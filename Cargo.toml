[workspace]

[package]
name = "xai-dissect"
version = "0.1.0"
edition = "2024"
# 1.88+: transitive `time` 0.3.47 (CVE fix) requires it; CI uses floating stable.
rust-version = "1.88"
description = "Zero-copy dissector for Grok-1 raw JAX/Pickle tensor shards"
license = "GPL-3.0-only"
repository = "https://github.com/rmems/xai-dissect"

[lib]
name = "xai_dissect"
path = "src/lib.rs"

[[bin]]
name = "xai-dissect"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
memchr = "2.7"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# Opt-in crash/error reporting for real-weight campaigns (see docs/ci.md).
# MSRV is 1.88 → sentry 0.49+ is fine. Slim feature set for a public CLI:
# panic + backtrace + transport + anyhow; skip logs/metrics/debug-images
# (release strips symbols; we do not want Sentry performance product on by default).
sentry = {
  version = "0.49",
  default-features = false,
  features = ["backtrace", "contexts", "panic", "transport", "anyhow"],
}

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
