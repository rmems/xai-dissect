# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Draft CodeRabbit config for rmems/xai-dissect (generated locally, not pushed).
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  fail_commit_status: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
  - '!**/target/**'
  - '!.beads/**/*.jsonl'
  path_instructions:
  - path: '**/*.rs'
    instructions: 'Rust edition 2024; `rust-version = "1.88"` (MSRV job runs `cargo check --locked --all-targets --all-features`); main CI on stable. Do not suggest downgrading the edition or using std/language APIs newer than the pinned toolchain/MSRV. CI gate: `cargo clippy --all-targets --all-features -- -D warnings`, `cargo test --locked`. Flag anything that would fail `cargo fmt --check` or clippy `-D warnings`. Keep CLI and export-schema compatibility; no inference or checkpoint mutation (read-only analysis tool).'
  - path: src/{parser,stats}/mod.rs
    instructions: 'Scrutinize every `unsafe` block (currently in `src/parser/mod.rs`, `src/stats/mod.rs`): require a written safety justification covering aliasing, lifetimes, alignment and bounds; prefer a safe abstraction when one exists. Flag any new `unsafe` outside these files.'
  - path: tests/fixtures/**
    instructions: Snapshot/export fixtures pin CLI output; a snapshot change must be explained by an intentional output change in the same PR.
  - path: '**/*.sh'
    instructions: Shell scripts. Must pass shellcheck; quote expansions and never echo secrets or tokens.
  - path: .github/workflows/**
    instructions: GitHub Actions workflows. Keep `permissions:` least-privilege and job commands in sync with the local gates documented in the repo. Every `uses:` is pinned to a full commit SHA today; new or bumped actions must be too.
  tools:
    clippy:
      enabled: true
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    biome:
      enabled: false
