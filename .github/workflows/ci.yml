# Full CI for xai-dissect (GH #33 / RM-148)
# - rust-ci: fmt, test, clippy, CLI smoke (required merge gate)
# - coverage: llvm-cov → Codecov (upload soft; token preferred, else OIDC)
# - qodana: static analysis (job fails when QODANA_TOKEN set; skip when unset)
# - release-observability: optional Sentry on main only
#
# Third-party actions pinned to full commit SHAs (immutable revisions:
# release tags peeled to commit, or branch-tip SHA for dtolnay/rust-toolchain).
# Out of scope: New Relic, Aikido, checkpoint/weight downloads, GPU jobs.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Default least privilege; Qodana elevates only for PR comments/checks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Avoid cancelling in-flight main Sentry release mutations mid-run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch tip
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: CLI smoke — root help
        run: cargo run --locked -- --help

      - name: CLI smoke — quant-plan help
        run: cargo run --locked -- quant-plan --help

      - name: CLI smoke — inventory help
        run: cargo run --locked -- inventory --help

      - name: CLI smoke — saaq-readiness help
        run: cargo run --locked -- saaq-readiness --help

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [rust-ci]
    permissions:
      contents: read
      # Tokenless Codecov upload via OIDC when CODECOV_TOKEN is unset.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch tip
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-llvm-cov

      - name: Generate lcov
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      # Detect token without putting it on checkout/test/tool steps.
      - name: Detect Codecov token
        id: codecov_token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "${CODECOV_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Codecov
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          files: lcov.info
          fail_ci_if_error: false
          # Prefer explicit token when set; OIDC only when token is empty.
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ steps.codecov_token.outputs.present != 'true' }}
        continue-on-error: true

  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Prefer QODANA_TOKEN (JetBrains docs name). Also accept
      # QODANA_CONFIGURATIONS_TOKEN (GitHub App / older Cloud installs) so a
      # misnamed secret still reaches the scan instead of silent skip.
      - name: Detect Qodana token
        id: qodana_token
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_CONFIGURATIONS_TOKEN: ${{ secrets.QODANA_CONFIGURATIONS_TOKEN }}
        run: |
          if [ -n "${QODANA_TOKEN}" ] || [ -n "${QODANA_CONFIGURATIONS_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Qodana Scan
        if: steps.qodana_token.outputs.present == 'true'
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891 # v2026.1.3
        with:
          pr-mode: true
          # 2026.2-eap is the current Rust linter on Hub (CLI may warn; scan still works).
          # Project open exceeded the default 10m timeout; raise to 45m.
          args: >-
            --image jetbrains/qodana-rust:2026.2-eap
            --property qd.rust.configuration.timeout.minutes=45
        env:
          # Prefer real Cloud project token; fallback for older App-created names.
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN || secrets.QODANA_CONFIGURATIONS_TOKEN }}

      - name: Qodana skipped (no token)
        if: steps.qodana_token.outputs.present != 'true'
        run: |
          echo "No Qodana project token secret found; skipping scan (Rust needs Ultimate/Cloud)."
          echo "Set repository secret QODANA_TOKEN from https://qodana.cloud/ project card"
          echo "(or QODANA_CONFIGURATIONS_TOKEN if the GitHub App created that name)."
          echo "See docs/ci.md — Qodana Cloud setup."

  release-observability:
    name: Release observability (Sentry)
    runs-on: ubuntu-latest
    needs: [rust-ci, coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Sentry secrets
        id: sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_XAI_DISSECT: ${{ secrets.SENTRY_PROJECT_XAI_DISSECT }}
        run: |
          if [ -n "${SENTRY_AUTH_TOKEN}" ] && [ -n "${SENTRY_ORG}" ] && [ -n "${SENTRY_PROJECT_XAI_DISSECT}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Sentry secrets not fully configured; skipping install and release."
          fi

      # Install only when configured; no secrets in this step; pin version + SHA-256 file.
      - name: Install pinned sentry-cli
        if: steps.sentry.outputs.configured == 'true'
        env:
          SENTRY_CLI_VERSION: "2.46.0"
        run: |
          set -euo pipefail
          base="https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}"
          asset="sentry-cli-Linux-x86_64"
          curl -fsSL -o "/tmp/${asset}" "${base}/${asset}"
          # Public release digest (committed under scripts/observability/, not a secret).
          expected="$(awk '{print $1}' "scripts/observability/${asset}.sha256")"
          actual="$(sha256sum "/tmp/${asset}" | awk '{print $1}')"
          test "${expected}" = "${actual}"
          chmod +x "/tmp/${asset}"
          sudo mv -f "/tmp/${asset}" /usr/local/bin/sentry-cli
          sentry-cli --version

      - name: Optional Sentry release
        if: steps.sentry.outputs.configured == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_XAI_DISSECT: ${{ secrets.SENTRY_PROJECT_XAI_DISSECT }}
          SENTRY_ENVIRONMENT: production
          AGENTOS_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/observability/sentry_release.sh
          ./scripts/observability/sentry_release.sh
