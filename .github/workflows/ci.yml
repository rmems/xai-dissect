# Full CI for xai-dissect (GH #33 / RM-148)
# - rust-ci: fmt, test, clippy, CLI smoke (required)
# - coverage: llvm-cov → Codecov (upload soft if token missing)
# - qodana: static analysis (soft without QODANA_TOKEN / license)
# - release-observability: optional Sentry on main only
#
# Out of scope: New Relic, Aikido, checkpoint/weight downloads, GPU jobs.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-ci:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: CLI smoke — root help
        run: cargo run --locked -- --help

      - name: CLI smoke — quant-plan help
        run: cargo run --locked -- quant-plan --help

      - name: CLI smoke — inventory help
        run: cargo run --locked -- inventory --help

      - name: CLI smoke — saaq-readiness help
        run: cargo run --locked -- saaq-readiness --help

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [rust-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate lcov
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.1
        with:
          args: --linter,qodana-rust
          pr-mode: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        # Rust linter needs Ultimate/Cloud token; soft-fail so required rust-ci
        # still gates merges when token is unset.
        continue-on-error: true

  release-observability:
    name: Release observability (Sentry)
    runs-on: ubuntu-latest
    needs: [rust-ci, coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Optional Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_XAI_DISSECT: ${{ secrets.SENTRY_PROJECT_XAI_DISSECT }}
          SENTRY_ENVIRONMENT: production
          AGENTOS_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${SENTRY_AUTH_TOKEN:-}" || -z "${SENTRY_ORG:-}" || -z "${SENTRY_PROJECT_XAI_DISSECT:-}" ]]; then
            echo "Sentry secrets not fully configured; skipping release hook."
            echo "Set SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT_XAI_DISSECT to enable."
            exit 0
          fi
          if ! command -v sentry-cli >/dev/null 2>&1; then
            curl -sL https://sentry.io/get-cli/ | bash
            export PATH="${HOME}/.local/bin:${PATH}"
          fi
          chmod +x scripts/observability/sentry_release.sh
          ./scripts/observability/sentry_release.sh
