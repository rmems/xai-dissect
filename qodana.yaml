# Qodana configuration for xai-dissect (GH #33)
# Linter: Qodana for Rust (Ultimate / Cloud token required via QODANA_TOKEN).
# CI skips the scan when QODANA_TOKEN is unset; when set, failureConditions apply.

version: "1.0"

# Docker Hub tags for jetbrains/qodana-rust: latest | 2026.2-eap | 2026.1-eap
# (plain "2026.1" does not exist — pull fails with manifest unknown).
# Prefer short linter id; CLI resolves the image. Pin EAP tag via image if needed.
linter: qodana-rust

profile:
  name: qodana.recommended

# Project is pure Rust; skip huge / non-source trees.
exclude:
  - name: All
    paths:
      - target
      - out
      - .beads
      - .kilo
      - .claude
      - .idea

# Soft quality gate: do not block on info noise; fail only on critical when
# token is present and the action is not continue-on-error.
failureConditions:
  severityThresholds:
    critical: 0
    high: 25
    any: 200
